<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acts 2: The Holy Spirit Adventure - Extended</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #378ADD;
            --accent-light: #E6F1FB;
            --success: #639922;
            --danger: #E24B4A;
            --warning: #BA7517;
            --text-dark: #2C2C2A;
            --text-light: #888780;
            --surface-light: #FFFFFF;
            --surface-pale: #F1EFE8;
            --border-color: #D3D1C7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e6f1fb 0%, #e1f5ee 100%);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, #1D9E75 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(55, 138, 221, 0.2);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            background: white;
            border-radius: 12px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
        }

        .progress-fill {
            background: linear-gradient(90deg, #1D9E75, var(--accent));
            height: 100%;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
        }

        .content-area {
            flex: 1;
            margin-bottom: 1.5rem;
        }

        .quest-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .quest-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.25rem;
        }

        .quest-icon {
            font-size: 32px;
        }

        .quest-titles h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .quest-subtitle {
            font-size: 13px;
            color: var(--text-light);
        }

        .story-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-dark);
            margin-bottom: 1.25rem;
        }

        .verse-box {
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            margin: 1.25rem 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--accent);
            font-style: italic;
        }

        .verse-reference {
            font-size: 12px;
            margin-top: 0.75rem;
            display: block;
            font-style: normal;
            opacity: 0.8;
        }

        .activity-section {
            background: var(--surface-pale);
            border-radius: 12px;
            padding: 1.25rem;
            margin: 1rem 0;
        }

        .activity-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .activity-question {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .option-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            color: var(--text-dark);
            font-weight: 400;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: #E8F5E9;
            color: var(--success);
            font-weight: 500;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background: #FCEBEB;
            border-color: var(--danger);
            color: var(--danger);
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #E8F5E9;
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect {
            background: #FCEBEB;
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .word-scramble-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .scramble-item {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .scramble-word {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 0.75rem;
            font-family: monospace;
        }

        .scramble-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .scramble-input.correct {
            border-color: var(--success);
            background: #E8F5E9;
        }

        .character-match-grid {
            display: grid;
            gap: 10px;
        }

        .match-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .match-left {
            background: var(--accent-light);
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
            font-weight: 500;
            color: var(--accent);
            font-size: 14px;
        }

        .match-arrow {
            font-size: 20px;
            text-align: center;
            color: var(--text-light);
        }

        .match-right {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-right:hover {
            border-color: var(--accent);
        }

        .match-right.selected {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 500;
        }

        .verse-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 0.75rem;
        }

        .verse-input.correct {
            border-color: var(--success);
            background: #E8F5E9;
        }

        .drag-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .category-group {
            background: var(--surface-pale);
            border-radius: 12px;
            padding: 1rem;
        }

        .category-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .drop-zone {
            background: white;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 0.75rem;
            min-height: 40px;
            margin-bottom: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
            align-content: flex-start;
        }

        .drop-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .draggable-item {
            background: var(--accent);
            color: white;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 13px;
            cursor: grab;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }

        .draggable-item:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .draggable-item.in-zone {
            background: var(--success);
        }

        .scene-builder {
            background: var(--surface-pale);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            min-height: 250px;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            position: relative;
        }

        .scene-item {
            font-size: 48px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s;
        }

        .scene-item:active {
            cursor: grabbing;
            transform: scale(1.2);
        }

        .scene-instructions {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            padding: 0.5rem;
        }

        .draggable-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .draggable-items .draggable-item {
            background: var(--accent);
            color: white;
            padding: 0.75rem 1rem;
            cursor: grab;
        }

        .button-group {
            display: flex;
            gap: 12px;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-large {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-large:active {
            transform: scale(0.96);
        }

        .btn-primary-large {
            background: linear-gradient(135deg, var(--accent) 0%, #1D9E75 100%);
            color: white;
            border-color: transparent;
        }

        .celebration {
            text-align: center;
            padding: 2rem 1rem;
        }

        .trophy {
            font-size: 64px;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .celebration h2 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 1.5rem 0;
        }

        .stat-card {
            background: var(--accent-light);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--accent);
            margin-top: 0.25rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .checkbox-item:hover {
            background: rgba(55, 138, 221, 0.08);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .memory-card {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1.5rem;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .memory-card:active {
            transform: scale(0.95);
        }

        .memory-card.flipped {
            background: white;
            color: var(--accent);
            border: 2px solid var(--accent);
            font-weight: 600;
        }

        .memory-card.matched {
            background: #E8F5E9;
            color: var(--success);
            border: 2px solid var(--success);
            cursor: default;
        }

        .certificate {
            background: linear-gradient(135deg, #FFF8E1 0%, #F0F4FF 100%);
            border: 3px solid var(--warning);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin: 1.5rem 0;
        }

        .certificate-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 1rem;
        }

        .certificate-name {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
            margin: 1rem 0;
            font-style: italic;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Acts 2: The Holy Spirit Adventure 🚀</h1>
            <p>Learn about the day God changed everything!</p>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">Section 1 of 13</span>
            </div>
        </div>

        <div class="content-area" id="contentArea"></div>

        <div class="button-group">
            <button class="btn-large" id="prevBtn" onclick="app.previousSection()" style="display: none;">← Back</button>
            <button class="btn-large btn-primary-large" id="nextBtn" onclick="app.nextSection()">Next →</button>
        </div>
    </div>

    <script>
        const app = {
            currentSection: 0,
            score: 0,

            sections: [
                {
                    title: "The Day Arrives ✨",
                    subtitle: "Something incredible is about to happen",
                    icon: "💨",
                    type: "story",
                    content: `
                        <p class="story-text">
                            Jesus' followers have been waiting in Jerusalem. Jesus told them to wait for a special gift from God—the Holy Spirit. About 120 people are gathered together when suddenly... WHOOSH! A sound like a mighty wind fills the entire house!
                        </p>
                        <div class="verse-box">
                            "Suddenly a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting. All of them were filled with the Holy Spirit and began to speak in other languages as the Spirit enabled them."
                            <span class="verse-reference">Acts 2:2-4</span>
                        </div>
                        <div class="activity-section">
                            <div class="activity-label">🎯 Quick Quiz</div>
                            <div class="activity-question">What did the followers hear first?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkAnswer(this, true)">A sound like a rushing, mighty wind</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">Angels singing</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">Thunder and rain</button>
                            </div>
                            <div class="feedback" id="feedback"></div>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">✨ Imagine This</div>
                            <div class="activity-question">What do you think it felt like to be there?</div>
                            <textarea class="reflection-input" placeholder="Describe what you imagine..."></textarea>
                        </div>
                    `
                },
                {
                    title: "Peter Gets Brave 🦁",
                    subtitle: "The scared follower becomes bold",
                    icon: "🦁",
                    type: "quiz",
                    content: `
                        <p class="story-text">
                            Before this day, Peter had been terrified. He'd even pretended he didn't know Jesus! But now, filled with the Holy Spirit, he stood up in front of a HUGE crowd and spoke boldly about Jesus. How did he find such courage?
                        </p>
                        <div class="verse-box">
                            "Peter stood up with the Eleven, raised his voice and addressed the crowd: 'Fellow Jews, let me explain this to you...'"
                            <span class="verse-reference">Acts 2:14</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">🎯 Question 1</div>
                            <div class="activity-question">What made Peter brave enough to speak?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, true, 'q1')">The power of the Holy Spirit</button>
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, false, 'q1')">He drank lots of juice</button>
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, false, 'q1')">His friends pushed him forward</button>
                            </div>
                            <div class="feedback" id="feedback-q1"></div>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">🎯 Question 2</div>
                            <div class="activity-question">What had Peter done before that made him scared?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, true, 'q2')">He said he didn't know Jesus</button>
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, false, 'q2')">He broke Jesus' favorite plate</button>
                                <button class="option-btn" onclick="app.checkMultiAnswer(this, false, 'q2')">He forgot where he lived</button>
                            </div>
                            <div class="feedback" id="feedback-q2"></div>
                        </div>
                    `
                },
                {
                    title: "Word Scramble Game 🔤",
                    subtitle: "Unscramble key words from the story",
                    icon: "🔤",
                    type: "scramble",
                    content: `
                        <p class="story-text">
                            Test your memory! Unscramble these important words from what you've learned so far. Think about what each word means in the Acts 2 story!
                        </p>

                        <div class="word-scramble-grid">
                            <div class="scramble-item">
                                <div class="scramble-word">TRPIIS</div>
                                <input type="text" class="scramble-input" placeholder="Type the word..." onchange="app.checkScramble(this, 'SPIRIT')">
                                <div class="feedback" style="margin-top: 0.5rem;"></div>
                            </div>

                            <div class="scramble-item">
                                <div class="scramble-word">CEOURAG</div>
                                <input type="text" class="scramble-input" placeholder="Type the word..." onchange="app.checkScramble(this, 'COURAGE')">
                                <div class="feedback" style="margin-top: 0.5rem;"></div>
                            </div>

                            <div class="scramble-item">
                                <div class="scramble-word">LIEVEBE</div>
                                <input type="text" class="scramble-input" placeholder="Type the word..." onchange="app.checkScramble(this, 'BELIEVE')">
                                <div class="feedback" style="margin-top: 0.5rem;"></div>
                            </div>

                            <div class="scramble-item">
                                <div class="scramble-word">DNLIW</div>
                                <input type="text" class="scramble-input" placeholder="Type the word..." onchange="app.checkScramble(this, 'WIND')">
                                <div class="feedback" style="margin-top: 0.5rem;"></div>
                            </div>

                            <div class="scramble-item">
                                <div class="scramble-word">TEPSECON</div>
                                <input type="text" class="scramble-input" placeholder="Type the word..." onchange="app.checkScramble(this, 'PENTECOST')">
                                <div class="feedback" style="margin-top: 0.5rem;"></div>
                            </div>
                        </div>
                    `
                },
                {
                    title: "Peter's Message 📢",
                    subtitle: "He tells the crowd about Jesus",
                    icon: "📢",
                    type: "story",
                    content: `
                        <p class="story-text">
                            Peter speaks to the crowd. He tells them about Jesus—how He lived, did miracles, was treated badly, died, and rose from the dead! The crowd listens closely to every word.
                        </p>
                        <div class="verse-box">
                            "God has made this Jesus, whom you crucified, both Lord and Messiah."
                            <span class="verse-reference">Acts 2:36</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">✏️ Fill in the Blank</div>
                            <div class="activity-question">Peter said: "Jesus is both ________ and Messiah"</div>
                            <input type="text" class="fill-blank" placeholder="Type the missing word..." id="fillBlank1">
                            <button class="option-btn" style="margin-top: 0.75rem;" onclick="app.checkBlank('fillBlank1', 'LORD')">Check Answer</button>
                        </div>
                    `
                },
                {
                    title: "Character Match 🎯",
                    subtitle: "Match people to what they did",
                    icon: "🎯",
                    type: "matching",
                    content: `
                        <p class="story-text">
                            Let's connect the characters to their actions! Read each person or group and figure out what they did in the Acts 2 story. This helps us see the different roles people played!
                        </p>

                        <div class="activity-section">
                            <div class="activity-label">🎯 Match Them Up</div>
                            <div class="activity-question">Click the right-side boxes to match:</div>
                            
                            <div class="character-match-grid">
                                <div class="match-row">
                                    <div class="match-left">Peter</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">Spoke boldly to the crowd</div>
                                </div>
                                <div class="match-row">
                                    <div class="match-left">The Crowd</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">Listened and believed</div>
                                </div>
                                <div class="match-row">
                                    <div class="match-left">The Holy Spirit</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">Gave power and courage</div>
                                </div>
                                <div class="match-row">
                                    <div class="match-left">Jesus</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">Rose from the dead!</div>
                                </div>
                            </div>
                        </div>
                    `
                },
                {
                    title: "Hearts Change! ❤️",
                    subtitle: "People respond to the message",
                    icon: "❤️",
                    type: "story",
                    content: `
                        <p class="story-text">
                            When Peter finished speaking, something amazing happened! The people listening felt their hearts change deeply. They realized Jesus really WAS God's Son. They asked Peter, "What should we do?" Peter told them to believe and be baptized.
                        </p>

            init() {
                this.renderSection();
                this.setupDragAndDrop();
            },

            renderSection() {
                const section = this.sections[this.currentSection];
                const container = document.getElementById('contentArea');

                container.innerHTML = `
                    <div class="quest-card">
                        <div class="quest-header">
                            <span class="quest-icon">${section.icon}</span>
                            <div class="quest-titles">
                                <h2>${section.title}</h2>
                                <p class="quest-subtitle">${section.subtitle}</p>
                            </div>
                        </div>
                        ${section.content}
                    </div>
                `;

                this.updateProgress();
                this.updateButtons();
                window.scrollTo(0, 0);
            },

            updateProgress() {
                const total = this.sections.length;
                const progress = ((this.currentSection + 1) / total) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = `Section ${this.currentSection + 1} of ${total}`;
            },

            updateButtons() {
                const nextBtn = document.getElementById('nextBtn');
                const prevBtn = document.getElementById('prevBtn');
                prevBtn.style.display = this.currentSection > 0 ? 'block' : 'none';
                nextBtn.innerHTML = this.currentSection === this.sections.length - 1 ? 'View Certificate 🎉' : 'Next →';
                
                const finalScore = document.getElementById('finalScore');
                if (finalScore) {
                    finalScore.textContent = this.score;
                }
            },

            nextSection() {
                if (this.currentSection < this.sections.length - 1) {
                    this.currentSection++;
                    this.renderSection();
                    this.setupDragAndDrop();
                } else {
                    alert('🎉 You completed the entire Acts 2 adventure! Share what you learned with your family!');
                }
            },

            previousSection() {
                if (this.currentSection > 0) {
                    this.currentSection--;
                    this.renderSection();
                    this.setupDragAndDrop();
                }
            },

            checkAnswer(button, isCorrect) {
                const buttons = button.parentElement.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.classList.remove('correct', 'incorrect'));

                if (isCorrect) {
                    button.classList.add('correct');
                    this.score += 10;
                } else {
                    button.classList.add('incorrect');
                }

                const feedback = button.parentElement.parentElement.querySelector('.feedback');
                if (feedback) {
                    feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');
                    feedback.textContent = isCorrect ? '✓ Correct! Great job!' : '✗ Not quite, try again!';
                }
            },

            checkMultiAnswer(button, isCorrect, id) {
                const buttons = button.parentElement.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.classList.remove('correct', 'incorrect'));

                if (isCorrect) {
                    button.classList.add('correct');
                    this.score += 10;
                } else {
                    button.classList.add('incorrect');
                }

                const feedback = document.getElementById(`feedback-${id}`);
                if (feedback) {
                    feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');
                    feedback.textContent = isCorrect ? '✓ Correct! Awesome!' : '✗ Not quite, try again!';
                }
            },

            checkScramble(input, answer) {
                const isCorrect = input.value.toUpperCase() === answer;
                const feedback = input.parentElement.querySelector('.feedback');
                
                if (isCorrect) {
                    input.classList.add('correct');
                    feedback.classList.add('show', 'correct');
                    feedback.textContent = '✓ Perfect!';
                    this.score += 10;
                } else {
                    feedback.classList.add('show', 'incorrect');
                    feedback.textContent = `✗ Try again! Hint: ${answer}`;
                }
            },

            checkBlank(id, answer) {
                const input = document.getElementById(id);
                const isCorrect = input.value.toUpperCase() === answer;
                
                if (isCorrect) {
                    input.classList.add('correct');
                    this.score += 10;
                    alert('✓ Correct! "Lord" is the perfect answer!');
                }
            },

            checkVerse(input, answer) {
                const isCorrect = input.value.toUpperCase() === answer;
                
                if (isCorrect) {
                    input.classList.add('correct');
                    this.score += 5;
                }
            },

            selectMatch(button, isCorrect) {
                button.classList.toggle('selected');
                if (button.classList.contains('selected')) {
                    this.score += 5;
                }
            },

            memoryFlip(card) {
                if (card.classList.contains('matched') || card.classList.contains('flipped')) return;

                card.classList.add('flipped');
                const pair = card.dataset.pair;

                const cardText = {
                    '1': '💨 Holy Wind',
                    '2': '🦁 Peter Bold',
                    '3': '📢 3,000 Believe',
                    '4': '🏘️ Church Grows'
                };

                card.textContent = cardText[pair];

                const flipped = document.querySelectorAll('.memory-card.flipped');
                if (flipped.length === 2) {
                    setTimeout(() => {
                        if (flipped[0].dataset.pair === flipped[1].dataset.pair) {
                            flipped[0].classList.add('matched');
                            flipped[1].classList.add('matched');
                            flipped.forEach(c => c.classList.remove('flipped'));
                            this.score += 20;
                        } else {
                            flipped.forEach(c => {
                                c.classList.remove('flipped');
                                c.textContent = '?';
                            });
                        }
                    }, 800);
                }
            },

            dragStart(e) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', e.target.innerHTML);
                e.target.dataset.source = e.target.dataset.category;
            },

            dragSceneStart(e) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', e.target.innerHTML);
            },

            setupDragAndDrop() {
                const zones = document.querySelectorAll('.drop-zone');
                const builder = document.getElementById('sceneBuilder');

                zones.forEach(zone => {
                    zone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        zone.classList.add('drag-over');
                    });

                    zone.addEventListener('dragleave', () => {
                        zone.classList.remove('drag-over');
                    });

                    zone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        zone.classList.remove('drag-over');
                        const item = e.dataTransfer.getData('text/html');
                        const sourceZone = e.dataTransfer.effectAllowed;
                        
                        const el = document.createElement('div');
                        el.className = 'draggable-item in-zone';
                        el.innerHTML = item;
                        zone.appendChild(el);
                    });
                });

                if (builder) {
                    builder.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        builder.style.borderColor = 'var(--accent)';
                    });

                    builder.addEventListener('dragleave', () => {
                        builder.style.borderColor = 'var(--border-color)';
                    });

                    builder.addEventListener('drop', (e) => {
                        e.preventDefault();
                        builder.style.borderColor = 'var(--border-color)';
                        const item = e.dataTransfer.getData('text/html');
                        
                        const el = document.createElement('div');
                        el.className = 'scene-item';
                        el.innerHTML = item;
                        builder.appendChild(el);
                    });
                }
            }
        };

        app.init();
    </script>
