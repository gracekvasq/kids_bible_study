<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acts 2: The Holy Spirit Adventure - Advanced Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #378ADD;
            --accent-light: #E6F1FB;
            --success: #639922;
            --danger: #E24B4A;
            --warning: #BA7517;
            --text-dark: #2C2C2A;
            --text-light: #888780;
            --surface-light: #FFFFFF;
            --surface-pale: #F1EFE8;
            --border-color: #D3D1C7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e6f1fb 0%, #e1f5ee 100%);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, #1D9E75 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(55, 138, 221, 0.2);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .progress-section {
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            background: white;
            border-radius: 12px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
        }

        .progress-fill {
            background: linear-gradient(90deg, #1D9E75, var(--accent));
            height: 100%;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
        }

        .content-area {
            flex: 1;
            margin-bottom: 1.5rem;
        }

        .quest-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .quest-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.25rem;
        }

        .quest-icon {
            font-size: 32px;
        }

        .quest-titles h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .quest-subtitle {
            font-size: 13px;
            color: var(--text-light);
        }

        .story-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-dark);
            margin-bottom: 1.25rem;
        }

        .verse-box {
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            margin: 1.25rem 0;
            font-size: 14px;
            line-height: 1.7;
            color: var(--accent);
            font-style: italic;
        }

        .verse-reference {
            font-size: 12px;
            margin-top: 0.75rem;
            display: block;
            font-style: normal;
            opacity: 0.8;
        }

        .activity-section {
            background: var(--surface-pale);
            border-radius: 12px;
            padding: 1.25rem;
            margin: 1rem 0;
        }

        .activity-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .activity-question {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .option-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            color: var(--text-dark);
            font-weight: 400;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: #E8F5E9;
            color: var(--success);
            font-weight: 500;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background: #FCEBEB;
            border-color: var(--danger);
            color: var(--danger);
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .feedback.correct {
            background: #E8F5E9;
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect {
            background: #FCEBEB;
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scramble-item {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .scramble-word {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 0.75rem;
            font-family: monospace;
        }

        .scramble-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .scramble-input.correct {
            border-color: var(--success);
            background: #E8F5E9;
        }

        .verse-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 0.75rem;
        }

        .verse-input.correct {
            border-color: var(--success);
            background: #E8F5E9;
        }

        .fill-blank {
            padding: 0.5rem 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            margin: 0.5rem 0;
            color: var(--text-dark);
        }

        .fill-blank.correct {
            border-color: var(--success);
            background: #E8F5E9;
        }

        .verse-comparison {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .verse-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .verse-text {
            font-size: 14px;
            font-style: italic;
            color: var(--text-dark);
            line-height: 1.6;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .verse-reference-small {
            font-size: 11px;
            color: var(--text-light);
            font-style: normal;
        }

        .match-grid {
            display: grid;
            gap: 10px;
        }

        .match-pair {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .match-left {
            background: var(--accent-light);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
        }

        .match-arrow {
            font-size: 18px;
            text-align: center;
            color: var(--text-light);
        }

        .match-right {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-right:hover {
            border-color: var(--accent);
        }

        .match-right.selected {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 12px;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-large {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-large:active {
            transform: scale(0.96);
        }

        .btn-primary-large {
            background: linear-gradient(135deg, var(--accent) 0%, #1D9E75 100%);
            color: white;
            border-color: transparent;
        }

        .celebration {
            text-align: center;
            padding: 2rem 1rem;
        }

        .trophy {
            font-size: 64px;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .celebration h2 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 1.5rem 0;
        }

        .stat-card {
            background: var(--accent-light);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--accent);
            margin-top: 0.25rem;
        }

        .comprehension-box {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .checkbox-item:hover {
            background: rgba(55, 138, 221, 0.08);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .certificate {
            background: linear-gradient(135deg, #FFF8E1 0%, #F0F4FF 100%);
            border: 3px solid var(--warning);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin: 1.5rem 0;
        }

        .certificate-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 1rem;
        }

        .certificate-name {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
            margin: 1rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Acts 2: Advanced Bible Study 📖</h1>
            <p>Deep dive into God's Word at Pentecost</p>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">Section 1 of 15</span>
            </div>
        </div>

        <div class="content-area" id="contentArea"></div>

        <div class="button-group">
            <button class="btn-large" id="prevBtn" onclick="app.previousSection()" style="display: none;">← Back</button>
            <button class="btn-large btn-primary-large" id="nextBtn" onclick="app.nextSection()">Next →</button>
        </div>
    </div>

    <script>
        const app = {
            currentSection: 0,
            score: 0,

            sections: [
                {
                    title: "The Day of Pentecost 💨",
                    subtitle: "Understanding the beginning",
                    icon: "💨",
                    content: `
                        <p class="story-text">
                            Pentecost means "50 days." After Jesus rose from the dead, He told His followers to wait in Jerusalem for the Holy Spirit. On the 50th day, something incredible happened. Let's read what the Bible says:
                        </p>

                        <div class="verse-box">
                            "When the day of Pentecost came, all the believers were gathered together in one place. Suddenly a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting. They saw what seemed to be tongues of fire that separated and came to rest on each of them. All of them were filled with the Holy Spirit and began to speak in other languages as the Spirit enabled them."
                            <span class="verse-reference">Acts 2:1-4</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">🎯 What Does This Mean?</div>
                            <div class="activity-question">When it says "violent wind," what do you think it means?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkAnswer(this, true)">A powerful, strong force showing God's strength</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">A scary storm that hurt people</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">A weather report for Jerusalem</button>
                            </div>
                            <div class="feedback" id="feedback"></div>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">📝 Three Signs of the Holy Spirit</div>
                            <div class="activity-question">According to Acts 2:1-4, what three things showed the Holy Spirit had come?</div>
                            <div class="comprehension-box">
                                <p style="font-size: 14px; margin-bottom: 0.75rem;"><strong>1. Sound like a violent _______________</strong></p>
                                <input type="text" class="fill-blank" placeholder="Type the word..." onchange="app.checkBlank(this, 'WIND')">
                            </div>
                            <div class="comprehension-box">
                                <p style="font-size: 14px; margin-bottom: 0.75rem;"><strong>2. What seemed to be tongues of _______________</strong></p>
                                <input type="text" class="fill-blank" placeholder="Type the word..." onchange="app.checkBlank(this, 'FIRE')">
                            </div>
                            <div class="comprehension-box">
                                <p style="font-size: 14px; margin-bottom: 0.75rem;"><strong>3. All were filled with the _______________  _______________</strong></p>
                                <input type="text" class="fill-blank" placeholder="Two words..." onchange="app.checkBlank(this, 'HOLY SPIRIT')">
                            </div>
                        </div>
                    `
                },
                {
                    title: "Peter's First Words 🗣️",
                    subtitle: "Understanding his message",
                    icon: "🗣️",
                    content: `
                        <p class="story-text">
                            When people heard the sound and saw the signs, a crowd gathered. Peter, who had been afraid just weeks before, stood up boldly. Let's see what he said:
                        </p>

                        <div class="verse-box">
                            "Peter stood up with the Eleven, raised his voice and addressed the crowd: 'Fellow Jews and all of you who live in Jerusalem, let me explain this to you; listen carefully to what I say.'"
                            <span class="verse-reference">Acts 2:14</span>
                        </div>

                        <div class="verse-box">
                            "'Men of Israel, listen to this: Jesus of Nazareth was a man accredited to you by God through miracles, wonders and signs, which God did among you through him, as you yourselves know.'"
                            <span class="verse-reference">Acts 2:22</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">💡 Peter's Boldness</div>
                            <div class="activity-question">What do these verses show us about Peter's courage?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkAnswer(this, true)">He stood up publicly and spoke clearly to the whole crowd</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">He whispered quietly to just a few people</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">He asked someone else to speak for him</button>
                            </div>
                            <div class="feedback" id="feedback"></div>
                        </div>
                    `
                },
                {
                    title: "What Peter Taught 📚",
                    subtitle: "The complete message",
                    icon: "📚",
                    content: `
                        <p class="story-text">
                            Peter explained what happened and why. He taught about Jesus' life, death, and resurrection. Here are the key verses:
                        </p>

                        <div class="verse-box">
                            "'This man was handed over to you by God's deliberate plan and foreknowledge; and you, with the help of wicked men, put him to death by nailing him to the cross. But God raised him from the dead, freeing him from the agony of death, because it was impossible for death to keep its hold on him.'"
                            <span class="verse-reference">Acts 2:23-24</span>
                        </div>

                        <div class="verse-box">
                            "'God has raised this Jesus to life, and we are all witnesses of it. Exalted to the right hand of God, he has received from the Father the promised Holy Spirit and has poured out what you now see and hear.'"
                            <span class="verse-reference">Acts 2:32-33</span>
                        </div>

                        <div class="verse-box">
                            "'Therefore let all Israel be assured of this: God has made this Jesus, whom you crucified, both Lord and Messiah.'"
                            <span class="verse-reference">Acts 2:36</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">🎯 Match the Truths</div>
                            <div class="activity-question">Match what Peter taught with what happened:</div>
                            <div class="match-grid">
                                <div class="match-pair">
                                    <div class="match-left">Jesus was put to death</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">By nailing him to the cross</div>
                                </div>
                                <div class="match-pair">
                                    <div class="match-left">God raised Jesus</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">From the dead</div>
                                </div>
                                <div class="match-pair">
                                    <div class="match-left">Jesus is now at</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">The right hand of God</div>
                                </div>
                                <div class="match-pair">
                                    <div class="match-left">Jesus is both</div>
                                    <div class="match-arrow">→</div>
                                    <div class="match-right" onclick="app.selectMatch(this, true)">Lord and Messiah</div>
                                </div>
                            </div>
                        </div>
                    `
                },
                {
                    title: "The People's Response 🙏",
                    subtitle: "What the crowd did",
                    icon: "🙏",
                    content: `
                        <p class="story-text">
                            When Peter finished speaking, something amazing happened. The people's hearts were deeply moved. Let's read what they said and did:
                        </p>

                        <div class="verse-box">
                            "'When the people heard this, they were cut to the heart and said to Peter and the other apostles, 'Brothers, what shall we do?'"
                            <span class="verse-reference">Acts 2:37</span>
                        </div>

                        <div class="verse-box">
                            "'Peter replied, 'Repent and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of your sins. And you will receive the gift of the Holy Spirit.'"
                            <span class="verse-reference">Acts 2:38</span>
                        </div>

                        <div class="verse-box">
                            "'Those who accepted his message were baptized, and about three thousand were added to their number that day.'"
                            <span class="verse-reference">Acts 2:41</span>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">❓ True or False</div>
                            <div class="activity-question">About 3,000 people chose to follow Jesus in one day.</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkAnswer(this, true)">True - This is exactly what Acts 2:41 says!</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">False - It was only a few people</button>
                            </div>
                            <div class="feedback" id="feedback"></div>
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">💭 Understanding the Meaning</div>
                            <div class="activity-question">What does "cut to the heart" mean in this verse?</div>
                            <div class="option-grid">
                                <button class="option-btn" onclick="app.checkAnswer(this, true)">They felt deeply sorry and wanted to change</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">They had physical pain in their chests</button>
                                <button class="option-btn" onclick="app.checkAnswer(this, false)">They didn't believe what Peter said</button>
                            </div>
                            <div class="feedback" id="feedback2"></div>
                        </div>
                    `
                },
                {
                    title: "Bible Verse Scramble 🔤",
                    subtitle: "Complete the verses",
                    icon: "🔤",
                    content: `
                        <p class="story-text">
                            Let's practice with actual Bible verses from Acts 2! Fill in the missing words. These are the EXACT words from Scripture!
                        </p>

                        <div class="activity-section">
                            <div class="activity-label">1️⃣ Acts 2:4</div>
                            <p style="font-size: 14px; margin-bottom: 0.75rem; font-style: italic;">
                                "All of them were filled with the _____________ _____________ and began to speak in other languages as the Spirit enabled them."
                            </p>
                            <input type="text" class="verse-input" placeholder="Two words..." onchange="app.checkVerse(this, 'HOLY SPIRIT')">
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">2️⃣ Acts 2:14</div>
                            <p style="font-size: 14px; margin-bottom: 0.75rem; font-style: italic;">
                                "Peter stood up with the Eleven, _____________ his voice and addressed the crowd..."
                            </p>
                            <input type="text" class="verse-input" placeholder="Type word..." onchange="app.checkVerse(this, 'RAISED')">
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">3️⃣ Acts 2:22</div>
                            <p style="font-size: 14px; margin-bottom: 0.75rem; font-style: italic;">
                                "'Jesus of Nazareth was a man accredited to you by God through _____________, _____________ and signs...'"
                            </p>
                            <input type="text" class="verse-input" placeholder="Two words..." onchange="app.checkVerse(this, 'MIRACLES WONDERS')">
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">4️⃣ Acts 2:36</div>
                            <p style="font-size: 14px; margin-bottom: 0.75rem; font-style: italic;">
                                "'Therefore let all Israel be assured of this: God has made this Jesus, whom you crucified, both _____________ and Messiah.'"
                            </p>
                            <input type="text" class="verse-input" placeholder="Type word..." onchange="app.checkVerse(this, 'LORD')">
                        </div>

                        <div class="activity-section">
                            <div class="activity-label">5️⃣ Acts 2:38</div>
                            <p style="font-size: 14px; margin-bottom: 0.75rem; font-style: italic;">

            init() {
                this.renderSection();
            },

            renderSection() {
                const section = this.sections[this.currentSection];
                const container = document.getElementById('contentArea');

                container.innerHTML = `
                    <div class="quest-card">
                        <div class="quest-header">
                            <span class="quest-icon">${section.icon}</span>
                            <div class="quest-titles">
                                <h2>${section.title}</h2>
                                <p class="quest-subtitle">${section.subtitle}</p>
                            </div>
                        </div>
                        ${section.content}
                    </div>
                `;

                this.updateProgress();
                this.updateButtons();
                window.scrollTo(0, 0);
            },

            updateProgress() {
                const total = this.sections.length;
                const progress = ((this.currentSection + 1) / total) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = `Section ${this.currentSection + 1} of ${total}`;
            },

            updateButtons() {
                const nextBtn = document.getElementById('nextBtn');
                const prevBtn = document.getElementById('prevBtn');
                prevBtn.style.display = this.currentSection > 0 ? 'block' : 'none';
                nextBtn.innerHTML = this.currentSection === this.sections.length - 1 ? 'View Certificate 🎉' : 'Next →';
                
                const finalScore = document.getElementById('finalScore');
                if (finalScore) {
                    finalScore.textContent = this.score;
                }
            },

            nextSection() {
                if (this.currentSection < this.sections.length - 1) {
                    this.currentSection++;
                    this.renderSection();
                } else {
                    alert('🎉 You completed the ADVANCED Acts 2 study! You are a true Bible scholar!');
                }
            },

            previousSection() {
                if (this.currentSection > 0) {
                    this.currentSection--;
                    this.renderSection();
                }
            },

            checkAnswer(button, isCorrect) {
                const buttons = button.parentElement.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.classList.remove('correct', 'incorrect'));

                if (isCorrect) {
                    button.classList.add('correct');
                    this.score += 10;
                } else {
                    button.classList.add('incorrect');
                }

                const feedback = button.parentElement.parentElement.querySelector('.feedback');
                if (feedback) {
                    feedback.classList.add('show', isCorrect ? 'correct' : 'incorrect');
                    feedback.textContent = isCorrect ? '✓ Correct! Excellent!' : '✗ Try again!';
                }
            },

            checkBlank(input, answer) {
                const isCorrect = input.value.toUpperCase() === answer;
                
                if (isCorrect) {
                    input.classList.add('correct');
                    this.score += 5;
                    input.disabled = true;
                }
            },

            checkVerse(input, answer) {
                const isCorrect = input.value.toUpperCase() === answer;
                
                if (isCorrect) {
                    input.classList.add('correct');
                    this.score += 10;
                    input.disabled = true;
                }
            },

            selectMatch(button, isCorrect) {
                button.classList.toggle('selected');
                if (button.classList.contains('selected')) {
                    this.score += 5;
                }
            }
        };
